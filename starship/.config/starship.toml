# Port of the old Oh My Posh zen prompt.
# Two lines: full path, grey branch, dirty "*", cyan ahead/behind, then ❯.
# Duration sits on the path line after the branch. Filling that line out to
# the terminal edge makes the shell wrap, which leaves a blank line before ❯.

# A new shell should start on the path line. Starship's add_newline
# prefix is a blank line, including the first prompt of a session.
add_newline = false
command_timeout = 1000
format = """$directory$git_branch$git_status$cmd_duration
$character"""

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "blue"
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = "[ $branch]($style)"
style = "bright-black"

# One "*" when the index or the worktree has changes, same as the old
# Oh My Posh check: or (.Working.Changed) (.Staging.Changed).
# Each state is a zero-width space so it still counts as present, and the
# format prints the asterisk once.
[git_status]
format = "([*](bright-black)$all_status)$ahead_behind"
ahead = "[⇡](cyan)"
behind = "[⇣](cyan)"
diverged = "[⇣⇡](cyan)"
conflicted = "\u200b"
untracked = "\u200b"
modified = "\u200b"
staged = "\u200b"
renamed = "\u200b"
deleted = "\u200b"
typechanged = "\u200b"
stashed = ""
up_to_date = ""

[cmd_duration]
min_time = 5000
format = "[ $duration]($style)"
style = "yellow"
show_milliseconds = false

[character]
format = "$symbol "
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
