# Run from this repo:
#   mise bootstrap   install the packages below, then deploy the dotfiles
#   mise dot apply   deploy the dotfiles only
# Preview with `mise bootstrap plan` or `mise dot diff`.

# What these dotfiles need. Installs missing packages; never upgrades them.
[bootstrap.packages]
"pacman:bat" = "latest"
"pacman:git-delta" = "latest"
"pacman:eza" = "latest"
"pacman:fzf" = "latest"
"pacman:zoxide" = "latest"
"pacman:superfile" = "latest"
"aur:oh-my-posh" = "latest"
# Zsh for terminals; bash stays Omarchy's login shell.
"pacman:zsh" = "latest"
"pacman:zsh-autosuggestions" = "latest"
"pacman:zsh-completions" = "latest"
# Prebuilt upstream release binary; the source package compiles Rust on every update.
"aur:zsh-patina-bin" = "latest"

# fzf-tab's AUR package is stale, so keep a clone pinned to a release tag.
[bootstrap.repos]
"~/.local/share/zsh/plugins/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab", ref = "v1.3.0" }

[dotfiles]
"~/.zshrc" = "zsh/.zshrc"
"~/.config/git/config" = "git/.config/git/config"
"~/.config/bat/config" = "bat/.config/bat/config"
"~/.config/omp/zen.toml" = "omp/.config/omp/zen.toml"
"~/.config/uwsm/env.d/bun" = "uwsm/.config/uwsm/env.d/bun"
"~/.config/superfile/config.toml" = "superfile/.config/superfile/config.toml"
"~/.config/omarchy/themed/superfile.toml.tpl" = "superfile/.config/omarchy/themed/superfile.toml.tpl"
"~/.config/ghostty/dotfiles.conf" = "ghostty/.config/ghostty/dotfiles.conf"
"~/.config/kitty/dotfiles.conf" = "kitty/.config/kitty/dotfiles.conf"
"~/.config/foot/dotfiles.ini" = "foot/.config/foot/dotfiles.ini"
"~/.config/alacritty/dotfiles.toml" = "alacritty/.config/alacritty/dotfiles.toml"

# Omarchy owns the main terminal configs: font changes and migrations rewrite
# them in place, and a refresh can replace one and drop the include. These
# edits put the include back on every apply, after Omarchy's own settings so
# the dotfiles ones win.
"~/.config/ghostty/config/dotfiles" = { line = 'config-file = ?"~/.config/ghostty/dotfiles.conf"' }
"~/.config/kitty/kitty.conf/dotfiles" = { line = "include ~/.config/kitty/dotfiles.conf" }
# Foot reads keys under a section, so the include gets its own [main].
# Foot only accepts # comments, so the block markers use them too.
"~/.config/foot/foot.ini/dotfiles" = { comment = "#", block = """
[main]
include=~/.config/foot/dotfiles.ini
""" }
# Alacritty takes imports from a list that applies before the file itself.
# A merge replaces the whole list, so it repeats Omarchy's theme import.
"~/.config/alacritty/alacritty.toml/dotfiles" = { source = "alacritty/import.toml", merge = true }

[bootstrap.hooks.post-dotfiles]
run = [
  "{{config_root}}/scripts/superfile-theme.sh",
  "command -v hyprctl >/dev/null && hyprctl reload || true",
  "command -v omarchy >/dev/null && omarchy restart terminal || true",
]
